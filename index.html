<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GABBIE SHOPPING CENTER</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* BIGGER OVERRIDES */
    html { font-size: 18px; } /* makes everything bigger */
    header h1 { font-size: 32px; }
    .search-bar input { font-size: 18px; padding: 15px 25px; }
    .product h3 { font-size: 20px; }
    .price { font-size: 24px; }
    .btn { font-size: 18px; padding: 15px; }
    .cart-info { font-size: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>GABBIE SHOPPING CENTER 🛒</h1>
  </header>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Search products..." onkeyup="searchProducts()">
  </div>

  <div class="products" id="product-list"></div>

  <div class="cart">
    <div class="cart-info">
      Items: <span id="cart-count">0</span> | Total: ₦<span id="cart-total">0</span>
    </div>
    <button class="btn" id="checkout" onclick="checkout()">Checkout</button>
  </div>

  <div id="cart-modal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:20;">
    <div style="background:white; margin:50px 20px; padding:20px; border-radius:12px; max-height:80vh; overflow-y:auto;">
      <h2 style="font-size:24px;">Your Cart</h2>
      <div id="cart-items"></div>
      <button onclick="document.getElementById('cart-modal').style.display='none'" class="btn" style="background:gray; margin-top:10px;">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
